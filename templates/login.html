<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cinematic.css') }}">
</head>
<body>
    <div class="grid-bg"></div>

    <div class="hud-overlay">
        <h2>SECURE VAULT</h2>
        <p>Encrypted File Storage & Management</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert-overlay">
            {% for category, message in messages %}
                <div class="alert-node {{ category }}">{{ message }}</div>
            {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="viewport-3d">
        <div class="panel">
            <div class="panel-header">
                <h3>Sign In</h3>
                <span>Access Your Secure Vault</span>
            </div>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="input-block">
                    <label>Username</label>
                    <input type="text" name="username" value="SYS_ADMIN" required>
                </div>
                <div class="input-block">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="action-trigger">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
